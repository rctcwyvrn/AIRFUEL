# From the repo root:  docker compose -f docker/compose.yaml up -d --build
services:
  airfuel-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "27555:27555/udp"  # lobby / matchmaker
      - "27600-27619:27600-27619/udp"  # per-match child servers
    restart: unless-stopped
